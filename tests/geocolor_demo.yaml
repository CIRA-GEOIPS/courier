apiVersion: runcourier.dev/v1alpha1
kind: Service
metadata:
  name: geocolor-demo
  namespace: demo
  description: This looks for ABI files and then produces GeoColor from them.
  docstring: |
    This uses a file watcher to look for incoming files.
    The incoming files are annotated with metadata.
    Job builders accept any 1 file with ABI as the sensor and full-disk as the sector.
    They dispatch that to a GeoColor creator job that produces output.
spec:
  heartbeat_interval: 30 # seconds between health-metric publications
  broker:
    host: rabbitmq
    port: 5672
    username: admin # these could be secrets set by kubernetes, docker, etc.
    password: admin_test # and can be set here or in the environment
  run:
    - file-poller:
        kind: data_monitor
        name: file_system_poller_watchdog # this is the plugin name
        config:
          path: /workspaces/courier/tests/watch-dir # where to watch
          metadata-tools:
            - goes16_abi # This adds metadata to files that look like goes16 files
            - goes18_abi # This adds metadata to files that look like goes18 files
    - abi-job-builder:
        kind: job_builder
        name: filter_and_group
        config:
          files_per_job: 1 # How many files required dispatch job, 1 per clavrx output
          time_grouping: # Optionally batch files by time (eg. 2 files in N:00-N:15)
            start: 2000-01-01 00:00:00 # optional reference time
            minutes: 15
          filters: # Metadata to filter on
            instrument: abi
            domain: Full-Disk
            product: CLAVR-x
    - produce-geocolor-from-abi:
        kind: dispatcher
        name: serial_bash
        config:
          bash_script: "python3 nar-procflow-overcast.py \n"
