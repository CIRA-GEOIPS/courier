apiVersion: geoips/driver/v1
kind: Service
name: testing_spec_not_complete
docstring: |
description: This is for testing! Not a complete spec.
spec:
  service_namespace: example_service1
  heartbeat_interval: 1000
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: admin_test
  run:
    - file_watching_service:
        kind: data_monitor
        name: file_system_poller_watchdog # this is the plugin name
        config:
          path: /workspaces/geoips_driver/tests/fake-watch-dir
          metadata-tools:
              - goes16_abi
              #- goes18_abi
              - himawari9_ahi
              - meteosat9_seviri
              - meteosat10_seviri
    - this_builds_jobs:
        kind: job_builder
        name: DummyJobBuilder
        config: null # just using defaults
    - dispatch_those_jobs:
        kind: dispatcher
        name: serial_bash
        config:
          bash_script: |
           echo "This is a test! A Script! A ~SCRIPT~"
           echo {file} # this is a templated field
           python3 -c "print('this is arbitrary python')"
