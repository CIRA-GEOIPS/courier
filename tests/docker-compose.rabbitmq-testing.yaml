# RabbitMQ for the tests that need a real broker.
#
# The tag is pinned, and deliberately matches the one CI and the container
# tier use. It used to float on `rabbitmq:management`, which quietly moved
# this tier onto a different major version than CI ran -- so a deprecated
# feature removed in 4.x failed here and passed there.
#
# Outside the devcontainer, which creates the shared network itself:
#
#     docker network create courier_testing 2>/dev/null || true
#     docker compose -f tests/docker-compose.rabbitmq-testing.yaml up -d
#     export COURIER_TEST_AMQP_URL='amqp://admin:admin_test@localhost:5672//'
#     python -m pytest -m rabbitmq --no-cov
#
# The default guest user is restricted to loopback and would be refused from
# another container, which is why these tests authenticate as admin.
services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    hostname: rabbitmqhost
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin_test
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - courier_testing
    stdin_open: true
    tty: true
networks:
  courier_testing:
    external: true
