apiVersion: geoips/driver/v1
kind: data_monitor_config
name: meteosat10_seviri
description: Information necessary to add metadata to Meteosat-9 SEVIRI L1B data files.
spec:
  file-metadata:
    meteosat10_seviri:
      platform: meteosat9
      sensor: seviri
      level: L1B
      sector: Full-Disk
      num_expected: 90
      match:
        - "H-000-MSG2__-MSG2________-_________-EPI______-\d{4}\d{2}\d{2}\d{2}\d{2}-__"
        - "H-000-MSG2__-MSG2________-_________-PRO______-\d{4}\d{2}\d{2}\d{2}\d{2}-__"
        - "H-000-MSG2__-MSG2________-IR*___-00000[1-8]___-\d{4}\d{2}\d{2}\d{2}\d{2}-C_"
        - "H-000-MSG2__-MSG2________-VIS*___-00000[1-8]___-\d{4}\d{2}\d{2}\d{2}\d{2}-C_"
        - "H-000-MSG2__-MSG2________-WV*___-00000[1-8]___-\d{4}\d{2}\d{2}\d{2}\d{2}-C_"
