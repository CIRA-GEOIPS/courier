apiVersion: geoips/driver/v1
kind: data_monitor_configs
interface: data_monitor_configs
family: standard
name: gk2a_ami
description: Information necessary to add metadata to GK-2A AMI L1B data files.
docstring: ""
spec:
  file-metadata:
    gk2a_ami_le1b:
      platform: gk2a
      sensor: ami
      level: L1B
      num_expected: 16
      date: 'gk2a_ami_le1b_(?P<YYYY>\d{4})(?P<MM>\d{2})(?P<DD>\d{2})(?P<HH>\d{2})(?P<NN>\d{2})'
      match:
          - 'gk2a_ami_le1b_*gk2a_ami_le1b_\d{4}\d{2}\d{2}\d{2}\d{2}.*'
    full-disk:
      sector: Full-Disk
      match:
          - 'gk2a_ami_le1b_fd*ge_*gk2a_ami_le1b_\d{4}\d{2}\d{2}\d{2}\d{2}.*'
    extended-local-area:
      sector: extended-local-area
      match:
          - 'gk2a_ami_le1b_ela*lc_*gk2a_ami_le1b_\d{4}\d{2}\d{2}\d{2}\d{2}.*'
    local-area:
      sector: local-area
      match:
          - 'gk2a_ami_le1b_la*ge_*gk2a_ami_le1b_\d{4}\d{2}\d{2}\d{2}\d{2}.*'