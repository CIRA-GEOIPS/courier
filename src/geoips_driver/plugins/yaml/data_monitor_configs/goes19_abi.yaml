apiVersion: geoips_driver/v1
name: goes19_abi
interface: data_monitor_configs
family: standard
description: Information necessary to add metadata to GOES-19 ABI L1B data files.
docstring: ""
spec:
  file-metadata:
    goes19_abi_l1b:
      platform: goes19
      sensor: abi
      level: L1B
      date: 's(?P<YYYY>\d{4})(?P<JJJ>\d{3})(?P<HH>\d{2})(?P<NN>\d{2})'
      match:
        - '.*M6C[01][1-6].*s\d{4}\d{3}\d{2}\d{2}.*'
    full-disk:
      sector: Full-Disk
      num_expected: 16
      match:
        - '.*RadF.*M6C[01][1-6].*s\d{4}\d{3}\d{2}\d{2}.*'
    conus:
      sector: CONUS
      num_expected: 16
      match:
        - '.*RadC.*M6C[01][1-6].*s\d{4}\d{3}\d{2}\d{2}.*'
    meso1:
      sector: Meso1
      num_expected: 16
      match:
        - '.*RadM1.*M6C[01][1-6].*s\d{4}\d{3}\d{2}\d{2}.*'
    meso2:
      sector: Meso2
      num_expected: 16
      match:
        - '.*RadM2.*M6C[01][1-6].*s\d{4}\d{3}\d{2}\d{2}.*'
