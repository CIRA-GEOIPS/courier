apiVersion: geoips/driver/v1
kind: data_monitor_config
name: goes19_abi
description: Information necessary to add metadata GOES19 ABI L1B to data files.
spec:
  file-metadata:
    goes19_abi_l1b:
      metadata:
        platform: goes19
        sensor: abi
        level: L1B
        num_expected: 16
        date: "s(?P<YYYY>\d{4})(?P<JJJ>\d{3})(?P<HH>\d{2})(?P<NN>\d{2})"
      match:
        - "*M6C[01][1-6]*s{{ YYYY }}{{ JJJ }}{{ HH }}{{ NN }}*"
    Full-Disk:
      metadata:
        sector: Full-Disk
      parent_dir: "/mnt/sat/grb/goes19/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadF"
    CONUS:
      metadata:
        sector: CONUS
      parent_dir: "/mnt/sat/grb/goes19/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadC"
    Meso1:
      metadata:
        sector: Meso1
      parent_dir: "/mnt/sat/grb/goes19/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadM1"
    Meso2:
      metadata:
        sector: Meso2
      parent_dir: "/mnt/sat/grb/goes19/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadM2"
