apiVersion: geoips_driver/v1
kind: data_monitor_config
interface: data_monitor_configs
family: standard
name: goes18_abi
description: Information necessary to add metadata GOES18 ABI L1B to data files.
docstring: ""
spec:
  file-metadata:
    goes18_abi_l1b:
      platform: goes18
      sensor: abi
      level: L1B
      num_expected: 16
      date: '.*s(?P<YYYY>\d{4})(?P<JJJ>\d{3})(?P<HH>\d{2})(?P<NN>\d{2}).*'
      match:
        - '*M6C[01][1-6]*s{{ YYYY }}{{ JJJ }}{{ HH }}{{ NN }}*'
    Full-Disk:
      sector: Full-Disk
      parent_dir: '/mnt/sat/grb/goes18/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadF'
    CONUS:
      sector: CONUS
      parent_dir: '/mnt/sat/grb/goes18/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadC'
    Meso1:
      sector: Meso1
      parent_dir: '/mnt/sat/grb/goes18/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadM1'
    Meso2:
      sector: Meso2
      parent_dir: '/mnt/sat/grb/goes18/{{ YYYY }}/{{ YYYY }}_{{ MM }}_{{ DD }}_{{ JJJ }}/abi/L1b/RadM2'
