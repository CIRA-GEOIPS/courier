interface: monitor_configs
family: standard
name: himawari9_ahi
docstring: |
  Information necessary to monitor for Himawari9 AHI L1B data.
spec:
  Full-Disk:
    parent_dir: "/mnt/sat/ahi-unzip/himawari9/YYYYMMDD"
    patterns:
      - "*YYYYMMDD_HHNN*_FLDK_*_S[01][0-9]10*"
    num_expected: 160
  Japan:
    parent_dir: "/mnt/sat/ahi-unzip/himawari9/YYYYMMDD"
    patterns:
      - "*YYYYMMDD_HHNN*_JP0[1-4]_*_S0101*"
    num_expected: 40
  Meso1:
    parent_dir: "/mnt/sat/ahi-unzip/himawari9/YYYYMMDD"
    patterns:
      - "*YYYYMMDD_HHNN*_R30[1-4]_*_S0101*"
    num_expected: 40
