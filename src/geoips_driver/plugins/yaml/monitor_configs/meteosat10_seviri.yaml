interface: monitor_configs
family: standard
name: meteosat9_seviri
docstring: |
  Information necessary to monitor for Meteosat9 SEVIRI L1B data files at CIRA.
spec:
  Full-Disk:
    parent_dir: "/mnt/sat/meteosat/meteosat-09/{{ YYYY }}{{ MM }}{{ DD }}/MSG2"
    patterns:
      - "H-000-MSG2__-MSG2_IODC___-_________-EPI______-{{ YYYY }}{{ MM }}{{ DD }}{{ HH }}{{ NN }}-__"
      - "H-000-MSG2__-MSG2_IODC___-_________-PRO______-{{ YYYY }}{{ MM }}{{ DD }}{{ HH }}{{ NN }}-__"
      - "H-000-MSG2__-MSG2_IODC___-IR*___-00000[1-8]___-{{ YYYY }}{{ MM }}{{ DD }}{{ HH }}{{ NN }}-C_"
      - "H-000-MSG2__-MSG2_IODC___-VIS*___-00000[1-8]___-{{ YYYY }}{{ MM }}{{ DD }}{{ HH }}{{ NN }}-C_"
      - "H-000-MSG2__-MSG2_IODC___-WV*___-00000[1-8]___-{{ YYYY }}{{ MM }}{{ DD }}{{ HH }}{{ NN }}-C_"
    num_expected: 90