interface: monitor_configs
family: standard
name: gk2a_ami
docstring: |
  Information necessary to monitor for GK-2A AMI L1B data files at CIRA.
spec:
  Full-Disk:
    parent_dir: "/mnt/GK2A/AMI/L1B/FD/YYYYMM/DD/HH"
    patterns:
      - "gk2a_ami_le1b_fd*ge_*YYYYMMDDHHNN*"
    num_expected: 16
  Extended-Local-Area:
    parent_dir: "/mnt/GK2A/AMI/L1B/ELA/YYYYMM/DD/HH"
    patterns:
      - "gk2a_ami_le1b_ela*lc_*YYYYMMDDHHNN*"
    num_expected: 16
  Local-Area:
    parent_dir: "/mnt/GK2A/AMI/L1B/LA/YYYYMM/DD/HH"
    patterns:
      - "gk2a_ami_le1b_la*ge_*YYYYMMDDHHNN*"
    num_expected: 16
