apiVersion: runcourier.dev/v1alpha1
kind: data_monitor_config
interface: data_monitor_configs
family: standard
name: meteosat10_seviri
description: Information necessary to add metadata to Meteosat-10 SEVIRI L1B data files.
docstring: ""
spec:
  file-metadata:
    meteosat10_seviri:
      source: meteosat10
      instrument: seviri
      processing_stage: L1B
      domain: Full-Disk
      num_expected: 90
      date: 'H-000-MSG3__-MSG3________-.*-(?P<YYYY>\d{4})(?P<MM>\d{2})(?P<DD>\d{2})(?P<HH>\d{2})(?P<NN>\d{2})-'
      match:
        - 'H-000-MSG3__-MSG3________-_________-EPI______-\d{4}\d{2}\d{2}\d{2}\d{2}-__'
        - 'H-000-MSG3__-MSG3________-_________-PRO______-\d{4}\d{2}\d{2}\d{2}\d{2}-__'
        - 'H-000-MSG3__-MSG3________-IR_.*___-00000[1-8]___-\d{4}\d{2}\d{2}\d{2}\d{2}-C_'
        - 'H-000-MSG3__-MSG3________-VIS.*___-00000[1-8]___-\d{4}\d{2}\d{2}\d{2}\d{2}-C_'
        - 'H-000-MSG3__-MSG3________-WV_.*___-00000[1-8]___-\d{4}\d{2}\d{2}\d{2}\d{2}-C_'
