[tool.poetry]
name = "runcourier"
version = "1.0.0-alpha.25"
description = "A plugin-based, event-driven orchestration framework for building data processing pipelines"
authors = ["Gwyn Uttmark <biosafetylevel5@gmail.com>", "Evan Rose <none@email.com>"]
repository = "https://github.com/biosafetylvl5/courier"

packages = [{include = "courier", from = "src"}]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

include = [
    "src/courier/plugins/**/*.yaml",
    "src/courier/py.typed",
]

[tool.poetry.dependencies] # must download to run
python = ">=3.11,<3.15"
rich = "*"
redis = { version = ">=4.0", optional = true }  # Required for HA state sync
rich-argparse = "*"
jinja2 = "*"  # Required for templates and script creation
watchdog = "*" # Required to listen for data (used by daemon)
pluginify = "*"
prometheus-client = "*"
pydantic = "*"
kombu = "*"
croniter = "*"
typer = "*"
lexeme-type = "*"
opentelemetry-api = ">=1.20"
opentelemetry-exporter-otlp-proto-http = ">=1.20"
opentelemetry-sdk = ">=1.20"
pyyaml = "*"
python-logging-loki = ">=0.3.1"
grafanalib = { version = ">=0.7.0", optional = true }

# Optional plugin dependencies (see [tool.poetry.extras])
boto3 = { version = ">=1.26", optional = true }
botocore = { version = ">=1.29", optional = true }
paramiko = { version = ">=3.0", optional = true }
kafka-python = { version = ">=2.0", optional = true }
httpx = { version = ">=0.24", optional = true }

# Optional dependencies for extras
sphinx = { version = "*", optional = true }
sphinx-rtd-theme = { version = "*", optional = true }
sphinx-argparse = { version = "*", optional = true }
sphinx-copybutton = { version = "*", optional = true }
sphinx-autodoc-typehints = { version = "*", optional = true }
sphinxcontrib-mermaid = { version = "*", optional = true }
textual = { version = ">=0.52.0", optional = true }
myst-parser = { version = "*", optional = true }
pinkrst = { version = "*", optional = true }
doc8 = { version = "*", optional = true }
prettier = { version = "*", optional = true }
ruff = { version = "*", optional = true }
mypy = { version = "*", optional = true }
pytest = { version = "*", optional = true }
pytest-cov = { version = "*", optional = true }
pytest-xdist = { version = "*", optional = true }
pytest-mock = { version = "*", optional = true }
types-pyyaml = { version = "*", optional = true }
types-dateparser = { version = "*", optional = true }
fakeredis = { version = "*", optional = true }
hypothesis = { version = "*", optional = true }

[tool.poetry.group.dev.dependencies]
# Development dependencies that are always installed for development
black = "*"
pre-commit = "*"
brassy = "*"

[tool.poetry.extras]
doc = [
    "sphinx",                    # for docs building
    "myst-parser",
    "sphinx-rtd-theme",          # for docs building
    "sphinx-copybutton",         # for docs building
    "sphinx-autodoc-typehints",  # for docs building
    "sphinxcontrib-mermaid",    # for docs building
    "sphinx-argparse",           # for docs building
    "pinkrst",                   # for rst formatting
    "doc8",                      # for rst linting
]

lint = [
    "pinkrst",                   # for rst auto-formatting
    "doc8",                      # for rst linting
    "prettier",                  # YAML, JSON linting
    "ruff",                      # Python linting
    "mypy",                      # Type checking
    "types-pyyaml",              # Type hints for pyyaml
    "types-dateparser",          # Type hints for dateparser
    "pre-commit"                 # For pre-commit hooks
]

test = [
    "pytest",                    # for running tests
    "pytest-cov",                # for test coverage
    "pytest-xdist",              # for parallel testing
    "pytest-mock",               # mocker fixture for plugin tests
    "fakeredis",                 # in-process Redis fake for sync tests
    "hypothesis",                # property-based testing for round-trip tests
    "boto3",                     # required by s3_poller tests
    "botocore",                  # required by s3_poller tests
    "paramiko",                  # required by sftp_poller tests
    "kafka-python",              # required by kafka_consumer tests
    "httpx",                     # required by http_dispatcher tests
]

ha = [
    "redis",                     # Redis client for HA state synchronization
]

grafana = [
    "grafanalib",                # Programmatic Grafana dashboard generation
]

# Optional extras for individual plugins (installed only when used)
s3 = ["boto3", "botocore"]       # Required for the s3_poller data monitor
sftp = ["paramiko"]              # Required for the sftp_poller data monitor
kafka = ["kafka-python"]         # Required for the kafka_consumer data monitor
http = ["httpx"]                 # Required for the http_dispatcher
viz = [
    "textual",
    "httpx",
]
all-monitors = ["boto3", "botocore", "paramiko", "kafka-python"]
all-dispatchers = ["httpx"]

[tool.poetry.scripts]
courier = "courier.cli.app:app"
lzl = "courier.cli.app:app"

[tool.poetry.plugins."runcourier.dev.plugin_packages"]
"courier" = "courier"

[tool.poetry.urls]
Homepage = "https://github.com/biosafetylvl5/courier"
Issues = "https://github.com/biosafetylvl5/courier/issues"
Documentation = "https://biosafetylvl5.github.io/courier/"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pluginify.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "paramiko.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kombu.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lexeme_type.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rich.text"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry_api.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grafanalib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
norecursedirs = ["xarray_utils"]
addopts = "-v -rf --ff --cov=src --cov-report=term-missing --cov-report=xml -m \"not limited_test_dataset_availability\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: CONCURRENT - marks tests as integration (select with '-m \"integration\"')",
    "spans_multiple_packages: CONCURRENT - marks integration tests that test functionality that could fail due to errors in multiple repositories. e.g. listing or validating all plugins, etc. Allows calling tests to ensure the same error will not cause tests in multiple repos to fail.",
    "limited_test_dataset_availability: CONCURRENT - marks integration tests that may have limited test dataset availability so may not be available to all users.",
    "base: OPTIONAL INDEPENDENT - integration tests that complete very quickly and require only a minimal installation for testing basic functionality within the current repository",
    "full: REQUIRED INDEPENDENT - integration tests that require a 'full' installation for testing all functionality within the current repository. 'full' marker includes all tests for the current repo except for tests included in the optional 'base' marker.",
    "contract: property-based serialization round-trip tests between pipeline stages.",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]  # Skip assert warnings

[tool.ruff]
# Target Python version
target-version = "py312"
line-length = 88
exclude = [
    "tests",
    "src/legacy",
]

[tool.ruff.lint]
# Enable a wide range of rules
select = [
    "E", "F", "W",  # pycodestyle and Pyflakes
    "I",            # isort
    "N",            # PEP8 naming
    "D",            # pydocstyle
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C4",           # flake8-comprehensions
    "SIM",          # flake8-simplify
    "ARG",          # flake8-unused-arguments
    "ERA",          # eradicate
    "PL",           # Pylint
    "RUF",          # Ruff-specific rules
    "TC",           # flake8-type-checking
    "S",            # flake8-bandit (security)
    "A",            # flake8-builtins
    "COM",          # flake8-commas
    "PT",           # flake8-pytest-style
    "PTH",          # flake8-use-pathlib
    "TRY",          # tryceratops (exception handling)
]

ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D212",  # multi-line-summary-first-line (conflicts with D213)
    "E731",  # allow variable assigned lambdas (PLEASE!!)
    "TRY003"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Allow assert statements in tests
"tests/**/*" = ["S101"]
# Ignore import violations in __init__.py files
"__init__.py" = ["F401"]
# Docstring RST tables exceed line length; cannot be wrapped
"src/courier/plugins/classes/dispatchers/serial_bash.py" = ["E501"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Unlike Black, force unix style line endings ("\n")
line-ending = "lf"

[project]
name = "runcourier"
version = "1.0.0-alpha.12"
requires-python = ">=3.11,<3.15"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "types-redis>=4.6.0.20241004",
]

