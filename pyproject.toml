[tool.poetry]
name = "runcourier"
version = "1.0.0-alpha.29"
description = "A plugin-based, event-driven orchestration framework for building data processing pipelines"
authors = ["Gwyn Uttmark <biosafetylevel5@gmail.com>", "Evan Rose <none@email.com>"]
repository = "https://github.com/biosafetylvl5/courier"

packages = [{include = "courier", from = "src"}]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Typing :: Typed",
]

include = [
    "src/courier/py.typed",
]

[tool.poetry.dependencies] # must download to run
python = ">=3.11,<3.15"
rich = "*"
redis = { version = ">=4.0", optional = true }  # Required for HA state sync
rich-argparse = "*"
jinja2 = "*"  # Required for templates and script creation
watchdog = "*" # Required to listen for data (used by daemon)
prometheus-client = "*"
pydantic = "*"
kombu = "*"
croniter = "*"
typer = "*"
lexeme-type = "*"
opentelemetry-api = ">=1.20"
opentelemetry-exporter-otlp-proto-http = ">=1.20"
opentelemetry-sdk = ">=1.20"
pyyaml = "*"
python-logging-loki = ">=0.3.1"
grafanalib = { version = ">=0.7.0", optional = true }

# Optional plugin dependencies (see [tool.poetry.extras])
boto3 = { version = ">=1.26", optional = true }
botocore = { version = ">=1.29", optional = true }
paramiko = { version = ">=3.0", optional = true }
kafka-python = { version = ">=2.0", optional = true }
httpx = { version = ">=0.24", optional = true }

# Optional dependencies for extras
sphinx = { version = "*", optional = true }
sphinx-rtd-theme = { version = "*", optional = true }
sphinx-argparse = { version = "*", optional = true }
sphinx-copybutton = { version = "*", optional = true }
sphinx-autodoc-typehints = { version = "*", optional = true }
sphinxcontrib-mermaid = { version = "*", optional = true }
textual = { version = ">=0.52.0", optional = true }
myst-parser = { version = "*", optional = true }
pinkrst = { version = "*", optional = true }
doc8 = { version = "*", optional = true }
prettier = { version = "*", optional = true }
ruff = { version = "*", optional = true }
mypy = { version = "*", optional = true }
pytest = { version = "*", optional = true }
pytest-cov = { version = "*", optional = true }
pytest-timeout = { version = "*", optional = true }
pytest-xdist = { version = "*", optional = true }
pytest-mock = { version = "*", optional = true }
types-pyyaml = { version = "*", optional = true }
types-dateparser = { version = "*", optional = true }
fakeredis = { version = "*", optional = true }
hypothesis = { version = "*", optional = true }
mutmut = { version = "*", optional = true }

[tool.poetry.group.dev.dependencies]
# Development dependencies that are always installed for development
black = "*"
pre-commit = "*"
brassy = "*"

[tool.poetry.extras]
doc = [
    "sphinx",                    # for docs building
    "myst-parser",
    "sphinx-rtd-theme",          # for docs building
    "sphinx-copybutton",         # for docs building
    "sphinx-autodoc-typehints",  # for docs building
    "sphinxcontrib-mermaid",    # for docs building
    "sphinx-argparse",           # for docs building
    "pinkrst",                   # for rst formatting
    "doc8",                      # for rst linting
]

lint = [
    "pinkrst",                   # for rst auto-formatting
    "doc8",                      # for rst linting
    "prettier",                  # YAML, JSON linting
    "ruff",                      # Python linting
    "mypy",                      # Type checking
    "types-pyyaml",              # Type hints for pyyaml
    "types-dateparser",          # Type hints for dateparser
    "pre-commit"                 # For pre-commit hooks
]

test = [
    "pytest",                    # for running tests
    "pytest-cov",                # for test coverage
    "pytest-timeout",            # fail hung tests instead of wedging CI
    "pytest-xdist",              # for parallel testing
    "pytest-mock",               # mocker fixture for plugin tests
    "fakeredis",                 # in-process Redis fake for sync tests
    "hypothesis",                # property-based testing for round-trip tests
    "boto3",                     # required by s3_poller tests
    "botocore",                  # required by s3_poller tests
    "paramiko",                  # required by sftp_poller tests
    "kafka-python",              # required by kafka_consumer tests
    "httpx",                     # required by http_dispatcher tests
    "grafanalib",                # required by tests/unit_tests/dashboard/*
    "mutmut",                    # mutation testing; see .github/workflows/mutation.yaml
]

ha = [
    "redis",                     # Redis client for HA state synchronization
]

grafana = [
    "grafanalib",                # Programmatic Grafana dashboard generation
]

# Optional extras for individual plugins (installed only when used)
s3 = ["boto3", "botocore"]       # Required for the s3_poller data monitor
sftp = ["paramiko"]              # Required for the sftp_poller data monitor
kafka = ["kafka-python"]         # Required for the kafka_consumer data monitor
http = ["httpx"]                 # Required for the http_dispatcher
viz = [
    "textual",
    "httpx",
]
all-monitors = ["boto3", "botocore", "paramiko", "kafka-python"]
all-dispatchers = ["httpx"]

[tool.poetry.scripts]
courier = "courier.cli.app:app"
lzl = "courier.cli.app:app"

# ---------------------------------------------------------------------------
# Plugin declarations
#
# One entry-point group per interface. The key is the plugin name operators
# write in a service config; the value points at the plugin class. Courier
# reads these with importlib.metadata (see courier.interfaces.discovery) — no
# filesystem scan and no registry cache.
#
# These tables are duplicated under [project.entry-points."courier.*"] at the
# bottom of this file. That is deliberate: `requires = ["poetry-core>=1.0.0"]`
# permits poetry-core 1.x, which ignores [project] entirely, so a release built
# by either backend version must still ship every plugin. The duplication is
# checked by test_pyproject_tables_agree — do not edit one table alone.
#
# Adding a plugin requires reinstalling, because entry points live in installed
# distribution metadata. test_declared_plugins_are_installed catches a stale
# editable install; test_plugin_classes_on_disk_are_declared catches a plugin
# nobody declared.
# ---------------------------------------------------------------------------

[tool.poetry.plugins."courier.data_monitors"]
cron_glob = "courier.plugins.data_monitors.cron_glob:CronGlob"
file_system_poller_watchdog = "courier.plugins.data_monitors.file_system_poller_watchdog:FileSystemPoller"
kafka_consumer = "courier.plugins.data_monitors.kafka_consumer:KafkaConsumer"
rabbit_mq_watcher = "courier.plugins.data_monitors.rabbit_mq_watcher:RabbitMQWatcher"
s3_poller = "courier.plugins.data_monitors.s3_poller:S3Poller"
sftp_poller = "courier.plugins.data_monitors.sftp_poller:SftpPoller"

[tool.poetry.plugins."courier.job_builders"]
DummyJobBuilder = "courier.plugins.job_builders.dummy_job_builder:DummyJobBuilder"
file_count_builder = "courier.plugins.job_builders.file_count_builder:FileCountBuilder"
filter_and_group = "courier.plugins.job_builders.filter_and_group:FilterAndGroupJobBuilder"
metadata_router = "courier.plugins.job_builders.metadata_router:MetadataRouterBuilder"

[tool.poetry.plugins."courier.dispatchers"]
http_dispatcher = "courier.plugins.dispatchers.http_dispatcher:HttpDispatcher"
parallel_bash = "courier.plugins.dispatchers.parallel_bash:ParallelBashDispatcher"
serial_bash = "courier.plugins.dispatchers.serial_bash:SerialBashDispatcher"
slurm_dispatcher = "courier.plugins.dispatchers.slurm_dispatcher:SlurmDispatcher"

[tool.poetry.plugins."courier.data_monitor_configs"]
gk2a_ami = "courier.plugins.data_monitor_configs.gk2a_ami:CONFIG"
goes16_abi = "courier.plugins.data_monitor_configs.goes16_abi:CONFIG"
goes18_abi = "courier.plugins.data_monitor_configs.goes18_abi:CONFIG"
goes19_abi = "courier.plugins.data_monitor_configs.goes19_abi:CONFIG"
himawari9_ahi = "courier.plugins.data_monitor_configs.himawari9_ahi:CONFIG"
meteosat10_seviri = "courier.plugins.data_monitor_configs.meteosat10_seviri:CONFIG"
meteosat9_seviri = "courier.plugins.data_monitor_configs.meteosat9_seviri:CONFIG"

[tool.poetry.urls]
Homepage = "https://github.com/biosafetylvl5/courier"
Issues = "https://github.com/biosafetylvl5/courier/issues"
Documentation = "https://biosafetylvl5.github.io/courier/"

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "croniter.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "paramiko.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kafka.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kombu.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lexeme_type.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "textual.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rich.text"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry_api.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "opentelemetry_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "grafanalib.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = "test_*.py"
norecursedirs = ["xarray_utils"]
# Integration tests are deselected by default: they take minutes and need real
# scheduling, so leaving them in the default run means developers stop running
# tests locally at all. Opt in with `-m integration`, or run everything with
# `-m ""`. CI runs both (see .github/workflows/pytest.yaml).
addopts = "-v -rf --ff --cov=src --cov-report=term-missing --cov-report=xml --timeout=300 -m \"not limited_test_dataset_availability and not integration\""
# A hung consumer thread used to wedge the whole run (and the nightly badge
# job) until the CI job timed out hours later. Fail the test instead.
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: CONCURRENT - marks tests as integration (select with '-m \"integration\"')",
    "spans_multiple_packages: CONCURRENT - marks integration tests that test functionality that could fail due to errors in multiple repositories. e.g. listing or validating all plugins, etc. Allows calling tests to ensure the same error will not cause tests in multiple repos to fail.",
    "limited_test_dataset_availability: CONCURRENT - marks integration tests that may have limited test dataset availability so may not be available to all users.",
    "base: OPTIONAL INDEPENDENT - integration tests that complete very quickly and require only a minimal installation for testing basic functionality within the current repository",
    "full: REQUIRED INDEPENDENT - integration tests that require a 'full' installation for testing all functionality within the current repository. 'full' marker includes all tests for the current repo except for tests included in the optional 'base' marker.",
    "contract: property-based serialization round-trip tests between pipeline stages.",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.mutmut]
# Mutation testing answers the question line coverage cannot: are these tests
# load-bearing? This suite once had 1200+ tests at 68% coverage and caught
# none of seven critical bugs, because a large share asserted the shape of the
# code rather than its behaviour. A surviving mutant is a change to production
# code that no test objected to.
#
# Scoped to the core domain and plumbing. The dashboard/viz packages are
# excluded deliberately: their mutants are overwhelmingly cosmetic (a changed
# panel width, a reworded description) and would bury the signal.
source_paths = ["src/courier"]
only_mutate = [
    "src/courier/types/*",
    "src/courier/routing/*",
    "src/courier/interfaces/*",
    "src/courier/utils/*",
    "src/courier/broker/*",
    "src/courier/managers/*",
]
# Integration tests are far too slow to run once per mutant; the unit suite
# runs in ~20s and is what we want to measure anyway.
pytest_add_cli_args_test_selection = ["tests/unit_tests/"]
# mutmut runs the suite from a copied tree. tests/ and pyproject.toml are
# copied by default, but the shipped root config is not, and the CLI smoke
# tests validate it by path.
also_copy = ["config.yaml"]

[tool.bandit]
exclude_dirs = ["tests", "docs"]
skips = ["B101"]  # Skip assert warnings

[tool.ruff]
# Target Python version
target-version = "py312"
line-length = 88
exclude = [
    "tests",
    "src/legacy",
]

[tool.ruff.lint]
# Enable a wide range of rules
select = [
    "E", "F", "W",  # pycodestyle and Pyflakes
    "I",            # isort
    "N",            # PEP8 naming
    "D",            # pydocstyle
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "C4",           # flake8-comprehensions
    "SIM",          # flake8-simplify
    "ARG",          # flake8-unused-arguments
    "ERA",          # eradicate
    "PL",           # Pylint
    "RUF",          # Ruff-specific rules
    "TC",           # flake8-type-checking
    "S",            # flake8-bandit (security)
    "A",            # flake8-builtins
    "COM",          # flake8-commas
    "PT",           # flake8-pytest-style
    "PTH",          # flake8-use-pathlib
    "TRY",          # tryceratops (exception handling)
]

ignore = [
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D212",  # multi-line-summary-first-line (conflicts with D213)
    "E731",  # allow variable assigned lambdas (PLEASE!!)
    "TRY003"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Allow assert statements in tests
"tests/**/*" = ["S101"]
# Ignore import violations in __init__.py files
"__init__.py" = ["F401"]
# Docstring RST tables exceed line length; cannot be wrapped
"src/courier/plugins/dispatchers/serial_bash.py" = ["E501"]
# Metadata configs are data. A filename regex is one atomic token -- wrapping it
# means editing the pattern, which is how ABI channels 7-10 got dropped once.
"src/courier/plugins/data_monitor_configs/*.py" = ["E501"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Unlike Black, force unix style line endings ("\n")
line-ending = "lf"

[project]
name = "runcourier"
version = "1.0.0-alpha.29"
requires-python = ">=3.11,<3.15"

# Mirror of the [tool.poetry.plugins.*] tables above. Both are declared so the
# plugins ship whichever poetry-core major builds the wheel: 1.x ignores
# [project] and reads [tool.poetry.plugins], while 2.x reads [project] and
# ignores [tool.poetry.plugins] *entirely* — the tables are alternatives, not
# additive, so a group present in only one silently disappears on one backend.
# Kept in sync by test_pyproject_tables_agree.

[project.entry-points."courier.data_monitors"]
cron_glob = "courier.plugins.data_monitors.cron_glob:CronGlob"
file_system_poller_watchdog = "courier.plugins.data_monitors.file_system_poller_watchdog:FileSystemPoller"
kafka_consumer = "courier.plugins.data_monitors.kafka_consumer:KafkaConsumer"
rabbit_mq_watcher = "courier.plugins.data_monitors.rabbit_mq_watcher:RabbitMQWatcher"
s3_poller = "courier.plugins.data_monitors.s3_poller:S3Poller"
sftp_poller = "courier.plugins.data_monitors.sftp_poller:SftpPoller"

[project.entry-points."courier.job_builders"]
DummyJobBuilder = "courier.plugins.job_builders.dummy_job_builder:DummyJobBuilder"
file_count_builder = "courier.plugins.job_builders.file_count_builder:FileCountBuilder"
filter_and_group = "courier.plugins.job_builders.filter_and_group:FilterAndGroupJobBuilder"
metadata_router = "courier.plugins.job_builders.metadata_router:MetadataRouterBuilder"

[project.entry-points."courier.dispatchers"]
http_dispatcher = "courier.plugins.dispatchers.http_dispatcher:HttpDispatcher"
parallel_bash = "courier.plugins.dispatchers.parallel_bash:ParallelBashDispatcher"
serial_bash = "courier.plugins.dispatchers.serial_bash:SerialBashDispatcher"
slurm_dispatcher = "courier.plugins.dispatchers.slurm_dispatcher:SlurmDispatcher"

[project.entry-points."courier.data_monitor_configs"]
gk2a_ami = "courier.plugins.data_monitor_configs.gk2a_ami:CONFIG"
goes16_abi = "courier.plugins.data_monitor_configs.goes16_abi:CONFIG"
goes18_abi = "courier.plugins.data_monitor_configs.goes18_abi:CONFIG"
goes19_abi = "courier.plugins.data_monitor_configs.goes19_abi:CONFIG"
himawari9_ahi = "courier.plugins.data_monitor_configs.himawari9_ahi:CONFIG"
meteosat10_seviri = "courier.plugins.data_monitor_configs.meteosat10_seviri:CONFIG"
meteosat9_seviri = "courier.plugins.data_monitor_configs.meteosat9_seviri:CONFIG"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "types-redis>=4.6.0.20241004",
]

