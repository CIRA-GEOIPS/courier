[build-system]
requires = ["setuptools>=61.2", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { namespaces = false }

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
"*" = [
    "plugins/*.yaml",
    "plugins/*/*.yaml",
    "plugins/*/*/*.yaml",
    "plugins/*/*/*/*.yaml",
    "plugins/*/*/*/*/*.yaml",
    "plugins/*.txt",
    "plugins/*/*.txt",
    "plugins/*/*/*.txt",
    "plugins/*/*/*/*.txt",
    "plugins/*/*/*/*/*.txt",
]

[tool.setuptools.dynamic]
entry-points = { file = ["entry-points.ini"] }

[tool.setuptools_scm]
"version_scheme" = "post-release"        # Use current version .postN vs incrementing
"local_scheme" = "no-local-version"      # Don't include hash, or date, just postN
"write_to" = "geoips_driver/_version.py" # Write an actual file

[project]
name = "geoips_driver"
authors = []
description = "geoips_driver GeoIPS Plugin Package"
readme = "README.md"
requires-python = ">=3.9"
keywords = []
license = { file = "LICENSE" }
classifiers = ["Programming Language :: Python :: 3"]
dynamic = ["version"]
dependencies = [
    "watchdog", # Required to listen for data (used by daemon)
    "Jinja2",   # Required for templates and script creation
]

[project.entry-points."geoips_driver.plugin_packages"]
"geoips_driver" = "geoips_driver"
