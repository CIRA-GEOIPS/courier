name: Mutation Testing

# Line coverage cannot tell you whether a test is load-bearing. This suite
# once had 1200+ tests at 68% coverage and caught none of seven critical bugs,
# because a large share asserted the shape of the code rather than its
# behaviour. A surviving mutant is a change to production code that no test
# objected to — the signal coverage does not give you.
#
# Deliberately NOT a required check. Mutation scores move for legitimate
# reasons (equivalent mutants, refactors), and a gate that cries wolf gets
# ignored. Read the summary, and treat a rising survivor count as a prompt to
# ask "what behaviour did we stop asserting?".

on:
  schedule:
    # Weekly, after the nightly badge job has settled.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      target:
        description: 'Mutant filter, e.g. courier.types.job.* (blank = configured scope)'
        required: false
        default: ''

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pip install mutmut

      - name: Run mutation testing
        id: mutate
        continue-on-error: true
        run: |
          set -o pipefail
          TARGET="${{ github.event.inputs.target }}"
          if [ -n "$TARGET" ]; then
            mutmut run "$TARGET" --max-children 4 2>&1 | tail -40
          else
            mutmut run --max-children 4 2>&1 | tail -40
          fi

      - name: Summarise
        if: always()
        run: |
          {
            echo "## Mutation testing"
            echo ""
            echo "A *survivor* is a change to production code that no test caught."
            echo ""
            echo '| Outcome | Count |'
            echo '|---------|-------|'
            mutmut results 2>/dev/null \
              | grep -oE ': [a-z ]+$' \
              | sort | uniq -c | sort -rn \
              | awk '{ n=$1; $1=""; sub(/^ *: */, "", $0); printf "| %s | %s |\n", $0, n }'
            echo ""
            echo "<details><summary>Surviving mutants</summary>"
            echo ""
            echo '```'
            mutmut results 2>/dev/null | grep -E 'survived$' | head -100
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "Inspect one with \`mutmut show <name>\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutants.sqlite
          if-no-files-found: ignore
