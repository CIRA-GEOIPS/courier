name: Documentation
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'sphinx/**'
      - 'src/courier/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[doc]

      - name: Build docs
        run: |
          cd sphinx
          sphinx-build -M html . _build -W --keep-going -n
        # sphinx-build directly (not make html) to skip the hardcoded -n flag
        # -W: warnings are errors   --keep-going: don't stop on first error   -n: nit-picky mode (warn on all missing references)

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: sphinx-docs
          path: sphinx/_build/html/
          retention-days: 3

      - name: Deploy to docs/
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main
          git checkout main
          rm -rf docs/
          mkdir -p docs/
          cp -r sphinx/_build/html/* docs/
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: deploy for ${{ github.ref_name }}"
            git push origin main
          fi
