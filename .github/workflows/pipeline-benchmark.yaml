
name: Pipeline Throughput Benchmark

on:
  pull_request:

permissions:
  contents: read

jobs:
  pipeline-throughput:
    name: Full Pipeline Throughput
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin_test
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      COURIER_TEST_AMQP_URL: amqp://admin:admin_test@127.0.0.1:5672//
      COURIER_BENCHMARK_FILES: "100"
      COURIER_BENCHMARK_TIMEOUT: "120"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run pipeline throughput benchmark
        run: |
          mkdir -p benchmark-results

          python -m pytest \
            tests/benchmarks/test_pipeline_throughput.py \
            -m performance \
            --no-cov \
            --timeout=0 \
            --basetemp=benchmark-tmp \
            --benchmark-json=benchmark-results/pipeline.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-throughput-results
          path: |
            benchmark-results/
            benchmark-tmp/**/courier.log
          if-no-files-found: warn

