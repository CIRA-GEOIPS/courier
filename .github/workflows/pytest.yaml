name: Run Pytest
on:
  push:
    branches: 'main'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]
          python3 -m pip install pytest
      - name: Create Registries
        run: |
          export PLUGINIFY_REBUILD_REGISTRIES=0
          export PLUGINIFY_NAMESPACE=runcourier.dev.plugin_packages
          pluginify create
      - name: Run unit tests
        timeout-minutes: 10
        run: |
          python3 -m pytest

      - name: Run integration tests
        # Deselected from the default run for local speed, so CI has to ask
        # for them explicitly or they would never execute anywhere.
        timeout-minutes: 20
        run: |
          python3 -m pytest -m integration --no-cov
