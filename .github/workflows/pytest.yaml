name: Run Pytest
on:
  push:
    branches: 'main'
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    services:
      # RabbitMQ restricts the default guest user to loopback, and a service container
      # is reached over the docker bridge, so guest is refused.
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin_test
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out the repository code
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]
          python3 -m pip install pytest
      - name: Run unit tests
        timeout-minutes: 10
        run: |
          python3 -m pytest
      - name: Run integration tests
        # Deselected from the default run for local speed, so CI has to ask
        # for them explicitly or they would never execute anywhere.
        timeout-minutes: 20
        run: |
          python3 -m pytest -m "integration and not docker and not performance" --no-cov
      - name: Run RabbitMQ-backed tests
        # The in-memory transport ignores exclusivity and never deletes a
        # queue, so the half of issue #44 about a builder's queue vanishing
        # can only be tested against a real broker.
        timeout-minutes: 10
        env:
          COURIER_TEST_AMQP_URL: amqp://admin:admin_test@localhost:5672//
        run: |
          python3 -m pytest -m "rabbitmq and not performance" --no-cov
      - name: Run Redis-backed tests
        # The in-process fake has no Lua runtime, so the server-side union
        # that lets two replicas of one builder share a job only runs here.
        timeout-minutes: 10
        env:
          COURIER_TEST_REDIS_URL: redis://localhost:6379/0
        run: |
          python3 -m pytest -m redis --no-cov
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: admin
          RABBITMQ_DEFAULT_PASS: admin_test
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      COURIER_TEST_AMQP_URL: amqp://admin:admin_test@127.0.0.1:5672//
      COURIER_BENCHMARK_FILES: "100"
      COURIER_BENCHMARK_TIMEOUT: "120"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run benchmarks
        run: |
          mkdir -p benchmark-results

          python -m pytest tests/benchmarks/ \
            -m performance \
            --no-cov \
            --timeout=0 \
            --benchmark-json=benchmark-results/benchmarks.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn

